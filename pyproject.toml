[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[project]
name = "nolang-mcp"
version = "0.0.4"
description = "NoLang (AI video generation). Superseded by the official plugin: claude plugin install nolang --marketplace mvrks-inc/nolang-plugin"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mavericks, inc.", email = "support.nolang@mvrks.co.jp"}
]
keywords = ["nolang", "mcp", "claude", "ai", "video"]
dependencies = []

[project.urls]
Homepage = "https://no-lang.com"
Repository = "https://github.com/mvrks-inc/nolang-plugin"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
nolang-mcp = "nolang_mcp:main"
nolang-mcp-stdio = "nolang_mcp:main"
nolang-mcp-http = "nolang_mcp:main_http"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
